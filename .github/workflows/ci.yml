name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_DB: flowforge_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowforge -d flowforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLOWFORGE_TEST_DATABASE_URL: postgresql://flowforge@127.0.0.1:5432/flowforge_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: verify
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm successful verification matrix
        if: ${{ needs.verify.result == 'success' }}
        run: echo "Verification matrix passed."

      - name: Fail when verification did not succeed
        if: ${{ needs.verify.result != 'success' }}
        run: exit 1
