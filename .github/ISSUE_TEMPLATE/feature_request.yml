name: Feature request
description: Propose a new capability or behavior
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What real workflow or operational problem is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the API or behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What other approaches did you consider?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core runtime
        - Persistence
        - Workers and queues
        - Triggers
        - Observability
        - CLI/API
        - Plugin ecosystem
        - Documentation
    validations:
      required: true
